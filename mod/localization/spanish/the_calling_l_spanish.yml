l_spanish:
 tc_call_maidens_decision:0 "Convocar doncellas a la corte"
 tc_call_maidens_decision_desc:0 "Es hora de enviar invitaciones a las doncellas casaderas de los alrededores y elegir a la más cualificada para unirse a mi corte."
 tc_call_maidens_decision_tooltip:0 "Se convoca a doncellas para que visiten tu corte"
 tc_call_maidens_decision_confirm:0 "Hacer el llamamiento"
 tc_call_maidens_decision_effect_tt:0 "Tres doncellas talentosas serán presentadas en tu corte y podrás elegir a una para que se incorpore a ella."

 the_calling.0001.t:0 "Han llegado las doncellas"
 the_calling.0001.desc:0 "Doncellas talentosas han respondido a tu llamada y han sido presentadas ante ti, cada una con sus propios dones.\n\nTras una cuidadosa deliberación, la corte ha llegado al consenso de que la más cualificada para unirse a tu corte estaría entre [maiden_1.GetFirstName], [maiden_3.GetFirstName] y [maiden_2.GetFirstName].\n\n¿A quién eliges para unirse a tu corte?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "Ninguna de ellas puede venir ya"

