 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: rasgos congénitos"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Garantizado"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "Las doncellas siempre tienen al menos un rasgo congénito positivo. Los rasgos congénitos negativos siempre se eliminan."
 setting_tc_maiden_congenital_traits_half_chance:0 "Probabilidad del 50 %"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Se prefieren las candidatas reales con un rasgo congénito positivo. Si ninguna lo tiene, el tercer puesto es para una doncella creada. Una doncella creada sin rasgos congénitos positivos obtiene uno con un 50 % de probabilidad. Las doncellas nunca tienen rasgos congénitos negativos."
 setting_tc_maiden_congenital_traits_vanilla:0 "Juego base"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Las doncellas no reciben ninguna probabilidad adicional de tener un rasgo congénito positivo, como en el juego base. Los rasgos congénitos negativos se eliminan igualmente."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: tiempo de espera"
 setting_tc_call_maidens_cooldown_1_year:0 "1 año"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "Tras convocar doncellas a la corte, un gobernante debe esperar 1 año antes de volver a hacerlo."
 setting_tc_call_maidens_cooldown_2_years:0 "2 años"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "Tras convocar doncellas a la corte, un gobernante debe esperar 2 años antes de volver a hacerlo."
 setting_tc_call_maidens_cooldown_3_years:0 "3 años"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "Tras convocar doncellas a la corte, un gobernante debe esperar 3 años antes de volver a hacerlo."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: coste"
 setting_tc_call_maidens_cost_50:0 "50 de prestigio"
 setting_tc_call_maidens_cost_50_desc:0 "Convocar doncellas a la corte cuesta 50 de prestigio."
 setting_tc_call_maidens_cost_150:0 "150 de prestigio"
 setting_tc_call_maidens_cost_150_desc:0 "Convocar doncellas a la corte cuesta 150 de prestigio."
 setting_tc_call_maidens_cost_200:0 "200 de prestigio"
 setting_tc_call_maidens_cost_200_desc:0 "Convocar doncellas a la corte cuesta 200 de prestigio."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: candidatas"
 setting_tc_maiden_source_real_first:0 "Reales primero"
 setting_tc_maiden_source_real_first_desc:0 "Una convocatoria busca primero mujeres reales solteras a tu alcance (mayor cuanto más alto sea tu título) que aceptarían una invitación a tu corte, y te presenta a las mejores. Solo se crean nuevas doncellas si no se encuentran suficientes. Solo la que elijas se une a tu corte."
 setting_tc_maiden_source_created:0 "Solo creadas"
 setting_tc_maiden_source_created_desc:0 "Cada convocatoria crea tres nuevas doncellas. Las que no elijas se marchan discretamente."
