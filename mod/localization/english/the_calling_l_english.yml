l_english:
 tc_call_maidens_decision:0 "Call Maidens to Court"
 tc_call_maidens_decision_desc:0 "It is time to send invitations to the eligible maidens within my reach and select the one most qualified to join my court."
 tc_call_maidens_decision_tooltip:0 "Maidens are called to visit your court"
 tc_call_maidens_decision_confirm:0 "Send out the call"
 tc_call_maidens_decision_effect_tt:0 "Three talented maidens will be presented at your court, and you can choose one to join it."

 the_calling.0001.t:0 "The Maidens Have Arrived"
 the_calling.0001.desc:0 "Talented maidens have answered your call and been presented before you, each with her own gifts.\n\nAfter careful consideration, the court has come to the consensus that the most qualified to join your court would be among [maiden_1.GetFirstName], [maiden_3.GetFirstName], or [maiden_2.GetFirstName].\n\nWho do you choose to join your court?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "None of them can come anymore"

