 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Congenital Traits"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Guaranteed"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "Maidens always come with at least one positive congenital trait. Negative congenital traits are always removed."
 setting_tc_maiden_congenital_traits_half_chance:0 "Half Chance"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Real candidates with a positive congenital trait are preferred. If none of them has one, the third place goes to a created maiden. A created maiden without a positive congenital trait gets one with a 50% chance. Maidens never have negative congenital traits."
 setting_tc_maiden_congenital_traits_vanilla:0 "Vanilla"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Maidens get no extra chance at a positive congenital trait, as in vanilla. Negative congenital traits are still removed."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Cooldown"
 setting_tc_call_maidens_cooldown_1_year:0 "1 Year"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "After calling maidens to court, a ruler must wait 1 year before doing so again."
 setting_tc_call_maidens_cooldown_2_years:0 "2 Years"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "After calling maidens to court, a ruler must wait 2 years before doing so again."
 setting_tc_call_maidens_cooldown_3_years:0 "3 Years"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "After calling maidens to court, a ruler must wait 3 years before doing so again."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Cost"
 setting_tc_call_maidens_cost_50:0 "50 Prestige"
 setting_tc_call_maidens_cost_50_desc:0 "Calling maidens to court costs 50 prestige."
 setting_tc_call_maidens_cost_150:0 "150 Prestige"
 setting_tc_call_maidens_cost_150_desc:0 "Calling maidens to court costs 150 prestige."
 setting_tc_call_maidens_cost_200:0 "200 Prestige"
 setting_tc_call_maidens_cost_200_desc:0 "Calling maidens to court costs 200 prestige."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Candidates"
 setting_tc_maiden_source_real_first:0 "Real First"
 setting_tc_maiden_source_real_first_desc:0 "A calling first looks for real unmarried women within your reach (wider the higher your title) who would accept an invitation to your court, and presents the best of them. New maidens are created only if too few are found. Only the one you choose moves to your court."
 setting_tc_maiden_source_created:0 "Created Only"
 setting_tc_maiden_source_created_desc:0 "Every calling creates three new maidens. Those you don't choose leave quietly."
