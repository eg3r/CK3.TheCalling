 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: cechy wrodzone"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Gwarantowane"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "Panny zawsze mają co najmniej jedną pozytywną cechę wrodzoną. Negatywne cechy wrodzone są zawsze usuwane."
 setting_tc_maiden_congenital_traits_half_chance:0 "Szansa 50%"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Pierwszeństwo mają prawdziwe kandydatki z pozytywną cechą wrodzoną. Jeśli żadna jej nie ma, trzecie miejsce przypada stworzonej pannie. Stworzona panna bez pozytywnej cechy wrodzonej ma 50% szansy, że ją otrzyma. Panny nigdy nie mają negatywnych cech wrodzonych."
 setting_tc_maiden_congenital_traits_vanilla:0 "Jak w grze podstawowej"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Tak jak w grze podstawowej, panny nie otrzymują dodatkowej szansy na pozytywną cechę wrodzoną. Negatywne cechy wrodzone są mimo to usuwane."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: czas odnowienia"
 setting_tc_call_maidens_cooldown_1_year:0 "1 rok"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "Po wezwaniu panien na dwór władca musi odczekać 1 rok, zanim zrobi to ponownie."
 setting_tc_call_maidens_cooldown_2_years:0 "2 lata"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "Po wezwaniu panien na dwór władca musi odczekać 2 lata, zanim zrobi to ponownie."
 setting_tc_call_maidens_cooldown_3_years:0 "3 lata"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "Po wezwaniu panien na dwór władca musi odczekać 3 lata, zanim zrobi to ponownie."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: koszt"
 setting_tc_call_maidens_cost_50:0 "50 prestiżu"
 setting_tc_call_maidens_cost_50_desc:0 "Wezwanie panien na dwór kosztuje 50 prestiżu."
 setting_tc_call_maidens_cost_150:0 "150 prestiżu"
 setting_tc_call_maidens_cost_150_desc:0 "Wezwanie panien na dwór kosztuje 150 prestiżu."
 setting_tc_call_maidens_cost_200:0 "200 prestiżu"
 setting_tc_call_maidens_cost_200_desc:0 "Wezwanie panien na dwór kosztuje 200 prestiżu."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: kandydatki"
 setting_tc_maiden_source_real_first:0 "Najpierw prawdziwe"
 setting_tc_maiden_source_real_first_desc:0 "Wezwanie najpierw szuka prawdziwych niezamężnych kobiet w twoim zasięgu (tym większym, im wyższy twój tytuł), które przyjęłyby zaproszenie na twój dwór, i przedstawia ci najlepsze z nich. Nowe panny są tworzone tylko wtedy, gdy znajdzie się ich za mało. Na twój dwór przybywa tylko ta, którą wybierzesz."
 setting_tc_maiden_source_created:0 "Tylko stworzone"
 setting_tc_maiden_source_created_desc:0 "Każde wezwanie tworzy trzy nowe panny. Te, których nie wybierzesz, po cichu odjeżdżają."
