l_polish:
 tc_call_maidens_decision:0 "Wezwij panny na dwór"
 tc_call_maidens_decision_desc:0 "Nadszedł czas, by rozesłać zaproszenia do panien na wydaniu z okolicy i wybrać tę, która najlepiej nadaje się na mój dwór."
 tc_call_maidens_decision_tooltip:0 "Panny zostają wezwane na twój dwór"
 tc_call_maidens_decision_confirm:0 "Roześlij wezwanie"
 tc_call_maidens_decision_effect_tt:0 "Na twoim dworze zostaną przedstawione trzy utalentowane panny, a ty wybierzesz jedną, która do niego dołączy."

 the_calling.0001.t:0 "Panny przybyły"
 the_calling.0001.desc:0 "Utalentowane panny odpowiedziały na twoje wezwanie i zostały ci przedstawione – każda ma własne dary.\n\nPo długim namyśle dworzanie zgodnie uznali, że najlepiej do twojego dworu nadaje się jedna z nich: [maiden_1.GetFirstName], [maiden_3.GetFirstName] lub [maiden_2.GetFirstName].\n\nKogo wybierasz do swojego dworu?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "Żadna z nich nie może już przybyć"

