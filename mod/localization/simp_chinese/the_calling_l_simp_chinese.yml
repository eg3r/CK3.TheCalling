l_simp_chinese:
 tc_call_maidens_decision:0 "召集少女入宫廷"
 tc_call_maidens_decision_desc:0 "是时候向我召唤所及之处所有适龄的少女发出邀请，从中挑选最合适的一位加入我的宫廷了。"
 tc_call_maidens_decision_tooltip:0 "少女们受召拜访你的宫廷"
 tc_call_maidens_decision_confirm:0 "发出召令"
 tc_call_maidens_decision_effect_tt:0 "三位才华出众的少女将被引荐至你的宫廷，你可以从中选择一位加入宫廷。"

 the_calling.0001.t:0 "少女们已经到来"
 the_calling.0001.desc:0 "才华出众的少女们响应了你的召唤，被引荐到你的面前，每一位都有自己的过人之处。\n\n经过深思熟虑，廷臣们一致认为，最适合加入你宫廷的人选就在[maiden_1.GetFirstName]、[maiden_3.GetFirstName]和[maiden_2.GetFirstName]之中。\n\n你要选择谁加入你的宫廷？"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "她们都已无法前来"

