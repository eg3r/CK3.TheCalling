 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!：先天特质"
 setting_tc_maiden_congenital_traits_guaranteed:0 "保证"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "少女必定拥有至少一项正面先天特质。负面先天特质总会被移除。"
 setting_tc_maiden_congenital_traits_half_chance:0 "50%概率"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "优先选择拥有正面先天特质的真实候选人。若无人拥有，第三个名额将交给新创造的少女。没有正面先天特质的新创造少女有50%的概率获得一项。少女绝不会拥有负面先天特质。"
 setting_tc_maiden_congenital_traits_vanilla:0 "原版"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "与原版相同，少女获得正面先天特质的概率不会额外提高。负面先天特质仍会被移除。"
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!：冷却时间"
 setting_tc_call_maidens_cooldown_1_year:0 "1年"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "召集少女入宫廷后，需等待1年才能再次召集。"
 setting_tc_call_maidens_cooldown_2_years:0 "2年"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "召集少女入宫廷后，需等待2年才能再次召集。"
 setting_tc_call_maidens_cooldown_3_years:0 "3年"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "召集少女入宫廷后，需等待3年才能再次召集。"
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!：花费"
 setting_tc_call_maidens_cost_50:0 "50威望"
 setting_tc_call_maidens_cost_50_desc:0 "召集少女入宫廷需要花费50威望。"
 setting_tc_call_maidens_cost_150:0 "150威望"
 setting_tc_call_maidens_cost_150_desc:0 "召集少女入宫廷需要花费150威望。"
 setting_tc_call_maidens_cost_200:0 "200威望"
 setting_tc_call_maidens_cost_200_desc:0 "召集少女入宫廷需要花费200威望。"
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!：候选人"
 setting_tc_maiden_source_real_first:0 "优先真实人物"
 setting_tc_maiden_source_real_first_desc:0 "召集会先在你的势力所及范围内（头衔越高范围越大）寻找愿意接受宫廷邀请的未婚真实女性，并引荐其中最出色的几位。只有找到的人数不足时，才会创造新的少女。只有你选中的那位会来到你的宫廷。"
 setting_tc_maiden_source_created:0 "仅新建"
 setting_tc_maiden_source_created_desc:0 "每次召集都会创造三位新的少女。未被选中的人会悄然离开。"
