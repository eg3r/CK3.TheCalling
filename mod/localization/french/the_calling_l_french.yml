 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#! : traits congénitaux"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Garanti"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "Les demoiselles ont toujours au moins un trait congénital positif. Les traits congénitaux négatifs sont toujours retirés."
 setting_tc_maiden_congenital_traits_half_chance:0 "Une chance sur deux"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Les candidates réelles dotées d’un trait congénital positif sont privilégiées. Si aucune n’en a, la troisième place revient à une demoiselle créée. Une demoiselle créée sans trait congénital positif en obtient un avec 50 % de chances. Les demoiselles n’ont jamais de trait congénital négatif."
 setting_tc_maiden_congenital_traits_vanilla:0 "Jeu de base"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Les demoiselles n’ont aucune chance supplémentaire d’obtenir un trait congénital positif, comme dans le jeu de base. Les traits congénitaux négatifs sont tout de même retirés."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#! : délai"
 setting_tc_call_maidens_cooldown_1_year:0 "1 an"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "Après avoir appelé des demoiselles à la cour, un dirigeant doit attendre 1 an avant de pouvoir recommencer."
 setting_tc_call_maidens_cooldown_2_years:0 "2 ans"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "Après avoir appelé des demoiselles à la cour, un dirigeant doit attendre 2 ans avant de pouvoir recommencer."
 setting_tc_call_maidens_cooldown_3_years:0 "3 ans"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "Après avoir appelé des demoiselles à la cour, un dirigeant doit attendre 3 ans avant de pouvoir recommencer."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#! : coût"
 setting_tc_call_maidens_cost_50:0 "50 de prestige"
 setting_tc_call_maidens_cost_50_desc:0 "Appeler des demoiselles à la cour coûte 50 points de prestige."
 setting_tc_call_maidens_cost_150:0 "150 de prestige"
 setting_tc_call_maidens_cost_150_desc:0 "Appeler des demoiselles à la cour coûte 150 points de prestige."
 setting_tc_call_maidens_cost_200:0 "200 de prestige"
 setting_tc_call_maidens_cost_200_desc:0 "Appeler des demoiselles à la cour coûte 200 points de prestige."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#! : candidates"
 setting_tc_maiden_source_real_first:0 "Réelles d’abord"
 setting_tc_maiden_source_real_first_desc:0 "Un appel cherche d’abord de vraies femmes célibataires à votre portée (plus large selon votre titre) qui accepteraient une invitation à votre cour, et vous présente les meilleures. De nouvelles demoiselles ne sont créées que s’il n’y en a pas assez. Seule celle que vous choisissez rejoint votre cour."
 setting_tc_maiden_source_created:0 "Créées uniquement"
 setting_tc_maiden_source_created_desc:0 "Chaque appel crée trois nouvelles demoiselles. Celles que vous ne choisissez pas repartent discrètement."
