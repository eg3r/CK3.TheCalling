l_french:
 tc_call_maidens_decision:0 "Appeler des demoiselles à la cour"
 tc_call_maidens_decision_desc:0 "Il est temps d’envoyer des invitations aux demoiselles à marier des environs et de choisir la plus qualifiée pour rejoindre ma cour."
 tc_call_maidens_decision_tooltip:0 "Des demoiselles sont appelées à se rendre à votre cour"
 tc_call_maidens_decision_confirm:0 "Lancer l’appel"
 tc_call_maidens_decision_effect_tt:0 "Trois demoiselles talentueuses seront présentées à votre cour, et vous pourrez choisir celle qui la rejoindra."

 the_calling.0001.t:0 "Les demoiselles sont arrivées"
 the_calling.0001.desc:0 "Des demoiselles talentueuses ont répondu à votre appel et vous ont été présentées, chacune avec ses propres dons.\n\nAprès mûre réflexion, la cour s’accorde à dire que la plus qualifiée pour rejoindre votre cour serait [maiden_1.GetFirstName], [maiden_3.GetFirstName] ou [maiden_2.GetFirstName].\n\nLaquelle choisissez-vous pour rejoindre votre cour ?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "Aucune d’elles ne peut plus venir"

