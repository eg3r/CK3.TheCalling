 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: 선천적 특성"
 setting_tc_maiden_congenital_traits_guaranteed:0 "보장"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "아가씨는 항상 하나 이상의 긍정적인 선천적 특성을 지닙니다. 부정적인 선천적 특성은 항상 제거됩니다."
 setting_tc_maiden_congenital_traits_half_chance:0 "50% 확률"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "긍정적인 선천적 특성을 가진 실존 후보가 우선됩니다. 아무도 없다면 세 번째 자리는 새로 만들어진 아가씨에게 돌아갑니다. 긍정적인 선천적 특성이 없는 만들어진 아가씨는 50% 확률로 하나를 얻습니다. 아가씨는 부정적인 선천적 특성을 갖지 않습니다."
 setting_tc_maiden_congenital_traits_vanilla:0 "바닐라"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "바닐라와 마찬가지로, 아가씨에게 긍정적인 선천적 특성을 얻을 추가 확률이 주어지지 않습니다. 부정적인 선천적 특성은 여전히 제거됩니다."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: 재사용 대기시간"
 setting_tc_call_maidens_cooldown_1_year:0 "1년"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "아가씨들을 궁정으로 소집한 후 다시 소집하려면 1년을 기다려야 합니다."
 setting_tc_call_maidens_cooldown_2_years:0 "2년"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "아가씨들을 궁정으로 소집한 후 다시 소집하려면 2년을 기다려야 합니다."
 setting_tc_call_maidens_cooldown_3_years:0 "3년"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "아가씨들을 궁정으로 소집한 후 다시 소집하려면 3년을 기다려야 합니다."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: 비용"
 setting_tc_call_maidens_cost_50:0 "위신 50"
 setting_tc_call_maidens_cost_50_desc:0 "아가씨들을 궁정으로 소집하려면 위신 50이 필요합니다."
 setting_tc_call_maidens_cost_150:0 "위신 150"
 setting_tc_call_maidens_cost_150_desc:0 "아가씨들을 궁정으로 소집하려면 위신 150이 필요합니다."
 setting_tc_call_maidens_cost_200:0 "위신 200"
 setting_tc_call_maidens_cost_200_desc:0 "아가씨들을 궁정으로 소집하려면 위신 200이 필요합니다."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: 후보"
 setting_tc_maiden_source_real_first:0 "실존 인물 우선"
 setting_tc_maiden_source_real_first_desc:0 "소집은 먼저 당신의 손이 닿는 범위(작위가 높을수록 넓음)에서 궁정 초대를 받아들일 미혼의 실존 여성을 찾아, 그중 가장 뛰어난 이들을 소개합니다. 찾은 수가 부족할 때만 새로운 아가씨가 만들어집니다. 당신이 고른 사람만 궁정으로 옵니다."
 setting_tc_maiden_source_created:0 "새로 만들기만"
 setting_tc_maiden_source_created_desc:0 "소집할 때마다 새로운 아가씨 3명이 만들어집니다. 선택받지 못한 이들은 조용히 떠납니다."
