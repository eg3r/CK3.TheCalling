l_korean:
 tc_call_maidens_decision:0 "아가씨들을 궁정으로 소집"
 tc_call_maidens_decision_desc:0 "이제 내 부름이 닿는 곳의 혼기가 찬 아가씨들에게 초대장을 보내, 내 궁정에 들이기에 가장 적합한 이를 고를 때가 되었다."
 tc_call_maidens_decision_tooltip:0 "아가씨들이 당신의 궁정을 방문하도록 소집됨"
 tc_call_maidens_decision_confirm:0 "소집령 발송"
 tc_call_maidens_decision_effect_tt:0 "재능 있는 아가씨 3명이 당신의 궁정에 소개되며, 그중 한 명을 골라 궁정에 들일 수 있습니다."

 the_calling.0001.t:0 "아가씨들의 도착"
 the_calling.0001.desc:0 "재능 있는 아가씨들이 나의 부름에 응해 내 앞에 섰다. 저마다 남다른 재주를 지니고 있다.\n\n신중한 논의 끝에, 신하들은 내 궁정에 들이기에 가장 적합한 인물이 [maiden_1.GetFirstName], [maiden_3.GetFirstName], [maiden_2.GetFirstName] 중 한 명이라는 데 뜻을 모았다.\n\n누구를 궁정에 들일 것인가?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "더 이상 아무도 올 수 없다"

