 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Vererbliche Eigenschaften"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Garantiert"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "Maiden haben immer mindestens eine positive vererbliche Eigenschaft. Negative vererbliche Eigenschaften werden immer entfernt."
 setting_tc_maiden_congenital_traits_half_chance:0 "50 % Chance"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Echte Kandidatinnen mit einer positiven vererblichen Eigenschaft werden bevorzugt. Hat keine von ihnen eine, geht der dritte Platz an eine geschaffene Maid. Eine geschaffene Maid ohne positive vererbliche Eigenschaft erhält mit 50 % Wahrscheinlichkeit eine. Maiden haben nie negative vererbliche Eigenschaften."
 setting_tc_maiden_congenital_traits_vanilla:0 "Grundspiel"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Wie im Grundspiel erhalten Maiden keine zusätzliche Chance auf eine positive vererbliche Eigenschaft. Negative vererbliche Eigenschaften werden dennoch entfernt."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Abklingzeit"
 setting_tc_call_maidens_cooldown_1_year:0 "1 Jahr"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "Nachdem ein Herrscher Maiden an den Hof gerufen hat, muss er 1 Jahr warten, bevor er es erneut tun kann."
 setting_tc_call_maidens_cooldown_2_years:0 "2 Jahre"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "Nachdem ein Herrscher Maiden an den Hof gerufen hat, muss er 2 Jahre warten, bevor er es erneut tun kann."
 setting_tc_call_maidens_cooldown_3_years:0 "3 Jahre"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "Nachdem ein Herrscher Maiden an den Hof gerufen hat, muss er 3 Jahre warten, bevor er es erneut tun kann."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Kosten"
 setting_tc_call_maidens_cost_50:0 "50 Prestige"
 setting_tc_call_maidens_cost_50_desc:0 "Maiden an den Hof zu rufen kostet 50 Prestige."
 setting_tc_call_maidens_cost_150:0 "150 Prestige"
 setting_tc_call_maidens_cost_150_desc:0 "Maiden an den Hof zu rufen kostet 150 Prestige."
 setting_tc_call_maidens_cost_200:0 "200 Prestige"
 setting_tc_call_maidens_cost_200_desc:0 "Maiden an den Hof zu rufen kostet 200 Prestige."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: Kandidatinnen"
 setting_tc_maiden_source_real_first:0 "Echte zuerst"
 setting_tc_maiden_source_real_first_desc:0 "Ein Ruf sucht zuerst echte unverheiratete Frauen in Eurer Reichweite (je höher Euer Titel, desto weiter), die eine Einladung an Euren Hof annehmen würden, und stellt Euch die besten vor. Neue Maiden werden nur geschaffen, wenn sich zu wenige finden. Nur die von Euch Gewählte kommt an Euren Hof."
 setting_tc_maiden_source_created:0 "Nur geschaffene"
 setting_tc_maiden_source_created_desc:0 "Jeder Ruf schafft drei neue Maiden. Die nicht Gewählten reisen still wieder ab."
