l_german:
 tc_call_maidens_decision:0 "Maiden an den Hof rufen"
 tc_call_maidens_decision_desc:0 "Es ist an der Zeit, allen heiratsfähigen Maiden in meiner Umgebung Einladungen zu senden und die Geeignetste für meinen Hof auszuwählen."
 tc_call_maidens_decision_tooltip:0 "Maiden werden an Euren Hof gerufen"
 tc_call_maidens_decision_confirm:0 "Den Ruf aussenden"
 tc_call_maidens_decision_effect_tt:0 "Drei talentierte Maiden werden Euch bei Hofe vorgestellt, und Ihr könnt eine von ihnen auswählen, die sich Eurem Hof anschließt."

 the_calling.0001.t:0 "Die Maiden sind eingetroffen"
 the_calling.0001.desc:0 "Talentierte Maiden sind Eurem Ruf gefolgt und wurden Euch vorgestellt, jede mit ihren eigenen Gaben.\n\nNach reiflicher Überlegung sind sich Eure Höflinge einig, dass die Geeignetste für Euren Hof [maiden_1.GetFirstName], [maiden_3.GetFirstName] oder [maiden_2.GetFirstName] ist.\n\nWen wählt Ihr für Euren Hof?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "Keine von ihnen kann mehr kommen"

