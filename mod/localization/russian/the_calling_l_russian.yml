l_russian:
 tc_call_maidens_decision:0 "Призвать дев ко двору"
 tc_call_maidens_decision_desc:0 "Пришло время разослать приглашения девам на выданье в округе и выбрать ту, что лучше всех подходит для моего двора."
 tc_call_maidens_decision_tooltip:0 "Девы получат приглашение посетить ваш двор"
 tc_call_maidens_decision_confirm:0 "Огласить призыв"
 tc_call_maidens_decision_effect_tt:0 "Вам представят трех талантливых дев, и одну из них вы сможете оставить при своем дворе."

 the_calling.0001.t:0 "Девы прибыли"
 the_calling.0001.desc:0 "Талантливые девы откликнулись на ваш призыв и предстали перед вами — у каждой свои дарования.\n\nПосле тщательного обсуждения придворные пришли к единому мнению: лучше всех для вашего двора подойдет одна из трех — [maiden_1.GetFirstName], [maiden_3.GetFirstName] или [maiden_2.GetFirstName].\n\nКого вы примете ко двору?"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "Никто из них больше не может прибыть"

