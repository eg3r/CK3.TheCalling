 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!: врожденные свойства"
 setting_tc_maiden_congenital_traits_guaranteed:0 "Гарантировано"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "У дев всегда есть хотя бы одно положительное врожденное свойство. Отрицательные врожденные свойства всегда удаляются."
 setting_tc_maiden_congenital_traits_half_chance:0 "Шанс 50%"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "Предпочтение отдается настоящим кандидаткам с положительным врожденным свойством. Если ни у одной его нет, третье место достается созданной деве. Созданная дева без положительного врожденного свойства получает его с вероятностью 50%. У дев никогда не бывает отрицательных врожденных свойств."
 setting_tc_maiden_congenital_traits_vanilla:0 "Как в оригинале"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "Девы не получают дополнительного шанса на положительное врожденное свойство, как в оригинальной игре. Отрицательные врожденные свойства по-прежнему удаляются."
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!: перезарядка"
 setting_tc_call_maidens_cooldown_1_year:0 "1 год"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "Призвав дев ко двору, правитель должен подождать 1 год, прежде чем сделать это снова."
 setting_tc_call_maidens_cooldown_2_years:0 "2 года"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "Призвав дев ко двору, правитель должен подождать 2 года, прежде чем сделать это снова."
 setting_tc_call_maidens_cooldown_3_years:0 "3 года"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "Призвав дев ко двору, правитель должен подождать 3 года, прежде чем сделать это снова."
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!: стоимость"
 setting_tc_call_maidens_cost_50:0 "50 престижа"
 setting_tc_call_maidens_cost_50_desc:0 "Призыв дев ко двору стоит 50 престижа."
 setting_tc_call_maidens_cost_150:0 "150 престижа"
 setting_tc_call_maidens_cost_150_desc:0 "Призыв дев ко двору стоит 150 престижа."
 setting_tc_call_maidens_cost_200:0 "200 престижа"
 setting_tc_call_maidens_cost_200_desc:0 "Призыв дев ко двору стоит 200 престижа."
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!: кандидатки"
 setting_tc_maiden_source_real_first:0 "Сначала настоящие"
 setting_tc_maiden_source_real_first_desc:0 "Призыв сначала ищет настоящих незамужних женщин в пределах вашей досягаемости (чем выше титул, тем она больше), которые приняли бы приглашение ко двору, и представляет лучших из них. Новые девы создаются, только если подходящих не хватает. Ко двору переезжает лишь та, кого вы выберете."
 setting_tc_maiden_source_created:0 "Только созданные"
 setting_tc_maiden_source_created_desc:0 "Каждый призыв создает трех новых дев. Те, кого вы не выбрали, тихо уезжают."
