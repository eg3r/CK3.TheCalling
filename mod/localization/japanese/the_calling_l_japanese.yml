l_japanese:
 tc_call_maidens_decision:0 "乙女たちを宮廷に招く"
 tc_call_maidens_decision_desc:0 "近隣の年頃の乙女たちに招待状を送り、我が宮廷に迎えるに最もふさわしい者を選ぶ時が来た。"
 tc_call_maidens_decision_tooltip:0 "乙女たちがあなたの宮廷に招かれる"
 tc_call_maidens_decision_confirm:0 "招集の触れを出せ"
 tc_call_maidens_decision_effect_tt:0 "才能ある乙女3名があなたの宮廷に参上する。そのうち1名を選び、宮廷に迎えることができる。"

 the_calling.0001.t:0 "乙女たちの到着"
 the_calling.0001.desc:0 "才能ある乙女たちがあなたの呼びかけに応え、あなたの前に並んだ。それぞれが独自の才を備えている。\n\n慎重な検討の末、廷臣たちは、宮廷に迎えるに最もふさわしいのは[maiden_1.GetFirstName]、[maiden_3.GetFirstName]、[maiden_2.GetFirstName]のいずれかであるとの結論で一致した。\n\n誰を宮廷に迎えるか？"
 the_calling.0001.a:0 "[maiden_1.GetFirstName][maiden_1.Custom('tc_GuestDescription')][maiden_1.Custom('tc_GuestCongenital')]"
 the_calling.0001.b:0 "[maiden_2.GetFirstName][maiden_2.Custom('tc_GuestDescription')][maiden_2.Custom('tc_GuestCongenital')]"
 the_calling.0001.c:0 "[maiden_3.GetFirstName][maiden_3.Custom('tc_GuestDescription')][maiden_3.Custom('tc_GuestCongenital')]"
 the_calling.0001.none:0 "もう誰も来ることができない"

