 game_rule_category_the_calling:0 "The Calling"
 rule_tc_maiden_congenital_traits:0 "#color:{0.25,0.8,0.75};bold The Calling#!：先天的特性"
 setting_tc_maiden_congenital_traits_guaranteed:0 "確定"
 setting_tc_maiden_congenital_traits_guaranteed_desc:0 "乙女は必ず1つ以上の良い先天的特性を持つ。悪い先天的特性は常に取り除かれる。"
 setting_tc_maiden_congenital_traits_half_chance:0 "50%の確率"
 setting_tc_maiden_congenital_traits_half_chance_desc:0 "良い先天的特性を持つ実在の候補者が優先される。誰も持っていない場合、3人目の枠は新たに生み出された乙女に与えられる。良い先天的特性を持たない生み出された乙女は、50%の確率で1つ得る。乙女が悪い先天的特性を持つことはない。"
 setting_tc_maiden_congenital_traits_vanilla:0 "バニラ"
 setting_tc_maiden_congenital_traits_vanilla_desc:0 "乙女が良い先天的特性を得る確率に追加の補正はない（バニラと同じ）。ただし、悪い先天的特性は引き続き取り除かれる。"
 rule_tc_call_maidens_cooldown:0 "#color:{0.25,0.8,0.75};bold The Calling#!：クールダウン"
 setting_tc_call_maidens_cooldown_1_year:0 "1年"
 setting_tc_call_maidens_cooldown_1_year_desc:0 "乙女たちを宮廷に招いた後、再び招くには1年待たねばならない。"
 setting_tc_call_maidens_cooldown_2_years:0 "2年"
 setting_tc_call_maidens_cooldown_2_years_desc:0 "乙女たちを宮廷に招いた後、再び招くには2年待たねばならない。"
 setting_tc_call_maidens_cooldown_3_years:0 "3年"
 setting_tc_call_maidens_cooldown_3_years_desc:0 "乙女たちを宮廷に招いた後、再び招くには3年待たねばならない。"
 rule_tc_call_maidens_cost:0 "#color:{0.25,0.8,0.75};bold The Calling#!：費用"
 setting_tc_call_maidens_cost_50:0 "威信点50"
 setting_tc_call_maidens_cost_50_desc:0 "乙女たちを宮廷に招くには威信点が50必要だ。"
 setting_tc_call_maidens_cost_150:0 "威信点150"
 setting_tc_call_maidens_cost_150_desc:0 "乙女たちを宮廷に招くには威信点が150必要だ。"
 setting_tc_call_maidens_cost_200:0 "威信点200"
 setting_tc_call_maidens_cost_200_desc:0 "乙女たちを宮廷に招くには威信点が200必要だ。"
 rule_tc_maiden_source:0 "#color:{0.25,0.8,0.75};bold The Calling#!：候補者"
 setting_tc_maiden_source_real_first:0 "実在の人物を優先"
 setting_tc_maiden_source_real_first_desc:0 "招集はまず、あなたの手が届く範囲（称号が高いほど広い）で宮廷への招待に応じる未婚の実在の女性を探し、その中から最も優れた者たちを紹介する。見つかった数が足りない場合にのみ、新たな乙女が生み出される。宮廷に移るのはあなたが選んだ者だけだ。"
 setting_tc_maiden_source_created:0 "新たに生み出すのみ"
 setting_tc_maiden_source_created_desc:0 "招集のたびに新たな乙女が3名生み出される。選ばれなかった者は静かに去る。"
